<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart STO Kiosk (Trace Mode)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gray: { 850: '#1f2937', 900: '#111827', 950: '#0b0f19' } } } }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; overflow: hidden; background-color: #f3f4f6; color: #111827; margin: 0; padding: 0; height: 100vh; width: 100vw; }
        #app-container { display: flex; flex-direction: column; height: 100%; width: 100%; max-width: 600px; margin: 0 auto; background: white; box-shadow: 0 0 15px rgba(0,0,0,0.1); position: relative; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #9ca3af; border-radius: 4px; }
        #scanner-view { width: 100%; flex: 1; background-color: #000; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        #camera-feed { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }
        #studio-view { width: 100%; flex: 1; background-color: #000; position: relative; display: flex; flex-direction: column; justify-content: center; overflow: hidden; }
        #cctv-canvas { width: 100%; height: 100%; object-fit: cover; }
        .toast { position: fixed; top: 1rem; left: 50%; transform: translateX(-50%); background-color: #1f2937; color: white; padding: 0.75rem 1.5rem; border-radius: 9999px; font-size: 0.875rem; font-weight: 600; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center; }
        .toast.show { opacity: 1; }
        .toast.error { background-color: #ef4444; }
    </style>
</head>
<body>

    <div id="app-container">
        <div class="bg-white border-b border-gray-300 shadow-sm shrink-0 z-20">
            <div class="p-3 flex justify-between items-center bg-gray-100">
                <h1 class="text-lg font-bold tracking-tight text-gray-800">STO TRACE MODE</h1>
                <button onclick="fetchInitialData()" class="p-2 bg-white rounded border text-xs font-bold text-gray-600">Sinkron</button>
            </div>
            <div class="w-full h-1 bg-gray-200"><div id="progress-bar" class="h-full bg-gray-800" style="width: 0%;"></div></div>
        </div>

        <div id="accordion-view" class="bg-gray-50 p-2 shrink-0 border-b max-h-[25vh] overflow-y-auto custom-scrollbar">
            <div class="text-center py-4 text-gray-400 text-xs font-medium">Mengunduh Master Data...</div>
        </div>

        <!-- SCANNER -->
        <div id="scanner-view">
            <video id="camera-feed" autoplay playsinline muted></video>
            <canvas id="hidden-canvas" class="hidden"></canvas>
            <div class="absolute top-2 left-2 z-10 bg-black/60 text-white text-[10px] px-2 py-1 rounded" id="debug-scan">Mencari Barcode...</div>
            <div class="absolute bottom-6 left-0 right-0 flex justify-center pointer-events-none z-10">
                <div class="bg-black/70 px-5 py-2 rounded-full text-white text-xs font-mono tracking-widest border border-gray-600">ARAHKAN KE BARCODE</div>
            </div>
        </div>

        <!-- STUDIO FORM -->
        <div id="studio-view" class="hidden bg-gray-100 flex-1 flex-col h-full relative">
            <div class="relative w-full h-[40vh] bg-black shrink-0 overflow-hidden border-b-4 border-gray-800">
                <video id="raw-video" class="hidden" autoplay playsinline muted></video>
                <canvas id="cctv-canvas"></canvas>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 flex flex-col gap-4 bg-gray-50 relative pb-20">
                <div class="bg-white p-3 rounded border flex flex-col gap-1">
                    <span class="text-[10px] text-gray-500 font-bold uppercase">SN Asset</span>
                    <span id="form-sn" class="font-mono font-bold text-gray-800 text-sm">-</span>
                </div>
            </div>
            <div class="absolute bottom-0 left-0 right-0 bg-white p-3 border-t z-20 flex gap-2">
                <button onclick="cancelStudio()" class="bg-gray-200 text-gray-700 font-bold py-3 px-4 rounded text-sm">BATAL</button>
                <button onclick="executeCapture()" class="flex-1 bg-gray-800 text-white font-bold py-3 rounded text-sm">REKAM & UPLOAD</button>
            </div>
        </div>
    </div>
    <div id="toast-msg" class="toast">Notifikasi</div>

    <script>
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbxP-nT3fjTL2dRPpK_XyF7kipz5WAPc2jbaCOYwGk0b_RFyr_H-Eupcvh-DtgYRsg9bdA/exec";
        let masterDbCache = {}; 
        let currSN = "";
        let currJenis = "PDA";
        let streamActive = null;
        let scanInterval = null;

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast-msg');
            t.textContent = msg;
            if (isError) t.classList.add('error'); else t.classList.remove('error');
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        document.addEventListener("DOMContentLoaded", () => {
            fetchInitialData();
            startNativeScanner();
        });

        function fetchInitialData() {
            fetch(GAS_API_URL + "?action=getInitialData")
                .then(res => res.json())
                .then(res => {
                    if (res.success) {
                        masterDbCache = res.masterDb;
                        showToast("Sistem Siap");
                    }
                }).catch(e=>{});
        }

        async function startNativeScanner() {
            const video = document.getElementById('camera-feed');
            const canvas = document.getElementById('hidden-canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });

            try {
                streamActive = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                video.srcObject = streamActive;
                await video.play();

                let barcodeDetector = null;
                if ('BarcodeDetector' in window) {
                    try {
                        barcodeDetector = new BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'qr_code', 'data_matrix'] });
                    } catch (e) {}
                }

                scanInterval = setInterval(async () => {
                    if (video.readyState !== video.HAVE_ENOUGH_DATA) return;
                    
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    let detectedText = null;
                    if (barcodeDetector) {
                        try {
                            const barcodes = await barcodeDetector.detect(canvas);
                            if (barcodes.length > 0) detectedText = barcodes[0].rawValue;
                        } catch (e) {}
                    }

                    if (detectedText) {
                        document.getElementById('debug-scan').textContent = "Terbaca: " + detectedText;
                        handleScannedCode(detectedText);
                    }
                }, 250);

            } catch (err) {
                showToast("Gagal akses kamera", true);
            }
        }

        function handleScannedCode(scannedValue) {
            let sn = scannedValue.trim();
            
            // --- BYPASS SEMENTARA: APAPUN YANG TER-SCAN LANGSUNG BUKA FORM ---
            alert("DEBUG TRACE: Barcode terbaca [" + sn + "]. Membuka Form...");

            if (scanInterval) clearInterval(scanInterval);
            if (streamActive) streamActive.getTracks().forEach(t => t.stop());

            currSN = sn;
            currJenis = "PDA";
            
            document.getElementById('scanner-view').classList.add('hidden');
            document.getElementById('accordion-view').classList.add('hidden');
            document.getElementById('studio-view').classList.remove('hidden');
            document.getElementById('studio-view').classList.add('flex');
            document.getElementById('form-sn').textContent = currSN;
        }

        function cancelStudio() {
            document.getElementById('studio-view').classList.add('hidden');
            document.getElementById('studio-view').classList.remove('flex');
            document.getElementById('accordion-view').classList.remove('hidden');
            document.getElementById('scanner-view').classList.remove('hidden');
            startNativeScanner();
        }

        function executeCapture() {
            alert("Tombol Rekam/Upload ditekan untuk SN: " + currSN);
            cancelStudio();
        }
    </script>
</body>
</html>
